[package]
name = "pito-footer"
version = "0.4.0"
authors = ["Gamer Dad"]
edition = "2024"
description = "A shortcut footer for ratatui apps: key hints that fit the width, a notice line, a y/n confirm bar, a one-line input and a double ctrl+c quit guard"
license = "MIT"
repository = "https://github.com/gmrdad82/pito-footer"
publish = false

[lib]
name = "pito_footer"

[features]
crossterm = ["dep:crossterm"]

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"], optional = true }
ratatui = { version = "0.30", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"
